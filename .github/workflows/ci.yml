name: CI Pipeline

on:
  push:
    branches: [main, monorepo]
  pull_request:
    branches: [main, monorepo]

jobs:
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint all workspaces
        run: npx turbo run lint

      - name: Typecheck all workspaces
        run: npx turbo run check-types

      - name: Run automated tests
        run: npx turbo run test

      - name: Build all apps and packages
        run: npx turbo run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_fake_for_build
          CLERK_SECRET_KEY: sk_test_fake_for_build
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/connectme
