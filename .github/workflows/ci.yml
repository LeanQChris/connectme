name: CI Pipeline

on:
  push:
    branches: [main, monorepo]
  pull_request:
    branches: [main, monorepo]

jobs:
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connectme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/connectme
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_fake_for_build
      CLERK_SECRET_KEY: sk_test_fake_for_build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint all workspaces
        run: npx turbo run lint

      - name: Typecheck all workspaces
        run: npx turbo run check-types

      - name: Run automated tests
        run: npx turbo run test

      - name: Build all apps and packages
        run: npx turbo run build

      - name: Run database migrations
        run: npm run db:migrate

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build-and-verify

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
          - image: worker
            file: apps/worker/Dockerfile
          - image: web
            file: apps/web/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -f ${{ matrix.file }} -t connectme/${{ matrix.image }}:ci .
